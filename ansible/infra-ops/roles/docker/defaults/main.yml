---
docker_supported_distributions:
  - Ubuntu
  - Debian

docker_supported_distribution_releases:
  - jammy
  - noble

docker_ubuntu_supported_distribution_releases:
  - resolute

docker_source: docker-ce
docker_apt_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_apt_repository: >-
  deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ('arm64' if ansible_architecture == 'aarch64' else ansible_architecture) }} signed-by={{ docker_keyring_path }}]
  https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable

docker_prerequisite_packages:
  - ca-certificates
  - curl

docker_ce_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_ubuntu_packages:
  - docker.io
  - docker-compose-v2

docker_keyring_directory: /etc/apt/keyrings
docker_keyring_path: /etc/apt/keyrings/docker.asc
docker_apt_source_path: /etc/apt/sources.list.d/docker.list

docker_daemon_config_path: /etc/docker/daemon.json
docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: '3'

docker_compose_plugin_required: true
