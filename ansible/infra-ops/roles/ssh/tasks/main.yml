---
- name: Configure SSH Port
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Port\s+'
    line: "Port {{ ssh_port }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart ssh

- name: Configure PermitRootLogin
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin\s+'
    line: "PermitRootLogin {{ ssh_permit_root_login }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart ssh

- name: Configure PasswordAuthentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication\s+'
    line: "PasswordAuthentication {{ ssh_password_authentication }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart ssh

- name: Configure PubkeyAuthentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication\s+'
    line: "PubkeyAuthentication {{ ssh_pubkey_authentication }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: restart ssh

- name: Configure AllowUsers
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AllowUsers\s+'
    line: "AllowUsers {{ ssh_allowed_users | join(' ') }}"
    validate: /usr/sbin/sshd -t -f %s
  when: ssh_allowed_users | length > 0
  notify: restart ssh

- name: Ensure SSH service is enabled and running
  ansible.builtin.service:
    name: "{{ 'ssh' if ansible_os_family == 'Debian' else 'sshd' }}"
    state: started
    enabled: true
