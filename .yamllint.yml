---
# ==============================================================================
# .yamllint.yml - Repository YAML Linter Configuration
# ==============================================================================
# Extends default rules with sensible boundaries for Ansible & IaC:
# - Relaxes line-length to 160 chars and emits warnings on overflow
# - Disables strict document-start markers ("---") across vars/defaults
# - Enforces strict duplicate key detection to prevent silent variable clobbering
# - Matches ansible-lint embedded yamllint compatibility requirements
# ==============================================================================
extends: default

rules:
  line-length:
    max: 160
    level: warning
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true
  truthy:
    level: warning
  comments:
    level: warning
    require-starting-space: false
    min-spaces-from-content: 1
  comments-indentation: false
  document-start: disable
  empty-lines:
    max: 3
    max-end: 1
  braces:
    max-spaces-inside: 1
    level: warning
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  key-duplicates: enable

ignore: |
  .ansible/
  .terraform/
  artifacts/
  configs/
  secrets/
